<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
    <title>蒋汶伶 | 小蒋的大学不设限</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --accent: #f97316;
            --accent-light: #fdba74;
            --neutral-100: #f8fafc;
            --neutral-200: #e2e8f0;
            --neutral-300: #cbd5e1;
            --neutral-600: #475569;
            --neutral-800: #1e293b;
            --neutral-900: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.12);
            --radius-xl: 2rem;
            --radius-lg: 1.25rem;
            --radius-md: 0.75rem;
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --transition: 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1e293b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --neutral-100: #1e293b;
                --neutral-200: #334155;
                --neutral-300: #475569;
                --neutral-600: #94a3b8;
                --neutral-800: #f1f5f9;
                --neutral-900: #f8fafc;
                --glass-bg: rgba(15, 23, 42, 0.6);
                --card-bg: rgba(30, 41, 59, 0.75);
                --text-main: #e2e8f0;
                --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.5);
            }
        }
        html.dark {
            --neutral-100: #1e293b;
            --neutral-200: #334155;
            --neutral-300: #475569;
            --neutral-600: #94a3b8;
            --neutral-800: #f1f5f9;
            --neutral-900: #f8fafc;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #e2e8f0;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 背景层 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: opacity 0.5s ease;
        }
        .day-bg {
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0F6 40%, #E0F7FF 100%);
            opacity: 1;
        }
        html.dark .day-bg {
            opacity: 0;
            pointer-events: none;
        }
        .night-bg {
            background: radial-gradient(ellipse at 30% 50%, #0b0f1e 0%, #020311 70%);
            opacity: 0;
            pointer-events: none;
        }
        html.dark .night-bg {
            opacity: 1;
            pointer-events: auto;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
            animation: floatCloud 20s infinite linear;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud::before { width: 60%; height: 80%; top: -40%; left: 15%; }
        .cloud::after { width: 50%; height: 70%; top: -25%; right: 10%; }
        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(40px); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite ease-in-out;
            opacity: 0.7;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.4); }
        }
        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            border-radius: 100px;
            animation: shoot 3s infinite ease-in;
            opacity: 0;
        }
        @keyframes shoot {
            0% { transform: translateX(0) translateY(0) rotate(-25deg); opacity: 1; }
            5% { opacity: 1; }
            100% { transform: translateX(-400px) translateY(400px) rotate(-25deg); opacity: 0; }
        }
        .nebula {
            position: absolute;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(30px);
            animation: breathe 8s infinite alternate;
        }
        @keyframes breathe {
            from { transform: scale(1); opacity: 0.3; }
            to { transform: scale(1.1); opacity: 0.6; }
        }
        @media print {
            .bg-layer, .star, .shooting-star, .nebula, .cloud { display: none; }
        }
        html {
            scroll-behavior: smooth;
            font-family: var(--font-sans);
        }
        body {
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-bottom: 2rem;
            position: relative;
            background: transparent;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 1.2rem 1.2rem 0;
            position: relative;
            z-index: 1;
        }
        /* 导航栏 */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0.7rem 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }
        .nav-name {
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #c084fc, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--neutral-600);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            transition: var(--transition);
            background: transparent;
        }
        .nav-links a:hover {
            background: rgba(124, 58, 237, 0.15);
            color: var(--primary);
        }
        .nav-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .icon-btn {
            background: var(--neutral-200);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.1rem;
            color: var(--neutral-600);
            position: relative;
        }
        .icon-btn:hover {
            background: var(--primary-light);
            color: white;
            transform: scale(1.08);
        }
        .audio-tooltip {
            position: absolute;
            bottom: 45px;
            right: -10px;
            background: #1e293b;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }
        .icon-btn:hover .audio-tooltip {
            opacity: 1;
        }
        /* Hero 区 */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2rem;
            border-radius: var(--radius-xl);
            overflow: hidden;
            isolation: isolate;
            box-shadow: var(--shadow-lg);
        }
        .hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            border-radius: var(--radius-xl);
        }
        .hero-content {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 2rem 1.5rem;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-xl);
        }
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.6);
            box-shadow: 0 0 30px rgba(167,139,250,0.7);
            background: #2d2b55;
            cursor: pointer;
        }
        .name-art {
            max-width: 80%;
            height: auto;
            display: block;
            margin: 0 auto 0.8rem;
            filter: drop-shadow(0 0 20px rgba(167,139,250,0.9));
            animation: nameGlow 2.5s infinite alternate;
        }
        @keyframes nameGlow {
            from { filter: drop-shadow(0 0 12px rgba(251,191,36,0.6)); }
            to { filter: drop-shadow(0 0 22px rgba(167,139,250,1)); }
        }
        .hero .subtitle {
            color: rgba(255,255,255,0.9);
            margin: 0.3rem 0 0.5rem;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .hero .eng-tag {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.75);
            font-style: italic;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
        }
        .hero .email-display {
            color: rgba(255,255,255,0.95);
            font-size: 0.95rem;
            margin: 0.8rem 0 0.2rem;
            word-break: break-all;
            background: rgba(255,255,255,0.15);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 25px;
            backdrop-filter: blur(4px);
        }
        .skill-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }
        .badge {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            letter-spacing: 0.3px;
        }
        /* 卡片通用（无边框，阴影分割） */
        .card, .flip-card, .exp-flip, .cert-item {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: none;
        }
        .card:hover, .flip-card:hover, .exp-flip:hover, .cert-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .card {
            padding: 1.3rem;
            margin-bottom: 1rem;
        }
        .education-hero {
            margin: 1.5rem 0;
        }
        /* 亮点翻转卡片 */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1.8rem 0;
        }
        .flip-card {
            background: transparent;
            perspective: 1000px;
            height: 170px;
            cursor: pointer;
            border-radius: var(--radius-md);
            box-shadow: none;
            backdrop-filter: none;
        }
        .flip-card:hover {
            transform: none;
            box-shadow: none;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: var(--radius-md);
        }
        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            border: none;
        }
        .flip-back {
            transform: rotateY(180deg);
            background: rgba(249, 115, 22, 0.15);
            font-size: 0.8rem;
            color: var(--neutral-600);
            text-align: center;
            overflow-y: auto;
        }
        .highlight-number {
            font-size: 2.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        /* 经历与项目翻转卡片 */
        .exp-flip {
            margin-bottom: 1.2rem;
            perspective: 1000px;
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
        }
        .exp-flip:hover {
            transform: none;
            box-shadow: none;
        }
        .exp-flip-inner {
            position: relative;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: var(--radius-lg);
        }
        .exp-flip.flipped .exp-flip-inner {
            transform: rotateY(180deg);
        }
        .exp-front, .exp-back {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 1.3rem;
            backface-visibility: hidden;
            box-shadow: var(--shadow);
            border: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .exp-front:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .exp-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotateY(180deg);
            overflow-y: auto;
            background: rgba(249,115,22,0.12);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .exp-front .period {
            font-size: 0.85rem;
            color: var(--neutral-600);
            margin: 0.4rem 0 0.2rem;
            font-weight: 500;
        }
        .exp-front .summary {
            font-size: 0.9rem;
            color: var(--neutral-600);
            margin-top: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .exp-front .turn-hint {
            font-size: 0.7rem;
            color: var(--primary);
            margin-top: 0.5rem;
            font-weight: 500;
        }
        /* 返回顶部 */
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 99;
            font-size: 1.4rem;
            color: white;
            transition: 0.3s;
            box-shadow: var(--shadow);
        }
        .back-to-top:hover {
            background: var(--accent);
        }
        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.3rem;
            margin: 1rem 0;
            border-bottom: 2px solid var(--neutral-200);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.1rem;
            font-weight: 600;
            color: var(--neutral-600);
            cursor: pointer;
            border-radius: 20px 20px 0 0;
            transition: var(--transition);
            white-space: nowrap;
            font-size: 0.85rem;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background: rgba(124,58,237,0.05);
        }
        /* 证书横向滚动 */
        .cert-scroll-wrapper {
            position: relative;
            margin: 1rem 0;
        }
        .cert-scroll-hint {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 0.7rem;
            color: var(--neutral-600);
            margin-bottom: 0.5rem;
        }
        .cert-grid {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-light) transparent;
            background: transparent;
        }
        .cert-grid::-webkit-scrollbar {
            height: 5px;
        }
        .cert-grid::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        .cert-item {
            flex: 0 0 145px;
            scroll-snap-align: start;
            padding: 0.7rem;
            text-align: center;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .cert-item img {
            width: 100%;
            height: 75px;
            object-fit: cover;
            border-radius: 0.5rem;
            margin-bottom: 0.3rem;
            background: rgba(0,0,0,0.1);
        }
        /* 灯箱 */
        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: none;
            font-size: 2.5rem;
            padding: 0.1rem 0.8rem;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
        }
        .lightbox-arrow.left { left: 15px; }
        .lightbox-arrow.right { right: 15px; }
    </style>
</head>
<body>
    <!-- 白天晴空背景 -->
    <div class="bg-layer day-bg" id="dayBg">
        <div class="cloud" style="width:140px; height:50px; top:12%; left:10%; opacity:0.9; animation-duration:22s;"></div>
        <div class="cloud" style="width:200px; height:65px; top:25%; right:8%; opacity:0.8; animation-duration:25s; animation-delay:4s;"></div>
        <div class="cloud" style="width:120px; height:45px; top:45%; left:60%; opacity:0.85; animation-duration:18s; animation-delay:2s;"></div>
        <div class="cloud" style="width:160px; height:55px; top:60%; left:25%; opacity:0.75; animation-duration:20s; animation-delay:6s;"></div>
    </div>
    <!-- 夜晚星空背景 -->
    <div class="bg-layer night-bg" id="nightBg">
        <div class="nebula" style="top:10%; left:5%; background: radial-gradient(circle at center, rgba(124,58,237,0.15) 0%, transparent 70%);"></div>
        <div class="nebula" style="bottom:15%; right:8%; background: radial-gradient(circle at center, rgba(249,115,22,0.2) 0%, transparent 70%);"></div>
        <div class="shooting-star" style="top:15%; left:80%; animation-delay:1s;"></div>
        <div class="shooting-star" style="top:25%; left:60%; animation-delay:2.5s;"></div>
    </div>

    <div class="container">
        <!-- 导航栏（品牌名 JW·Ling，链接中文） -->
        <nav class="navbar" role="navigation" aria-label="主导航">
            <span class="nav-name">JW·Ling</span>
            <div class="nav-links">
                <a href="#hero">首页</a>
                <a href="#education">教育</a>
                <a href="#highlights">亮点</a>
                <a href="#experience">经历</a>
                <a href="#projects">项目</a>
                <a href="#skills">技能</a>
                <a href="#certs">证书</a>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" id="audioToggle" aria-label="音频控制" title="打开背景音乐">
                    🔇
                    <span class="audio-tooltip">打开背景音乐，感受我的风格</span>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="切换深色模式">🌓</button>
                <button class="icon-btn" id="printBtn" aria-label="打印简历">🖨️</button>
            </div>
        </nav>

        <!-- Hero 摘要区 -->
        <section id="hero" class="hero">
            <video class="hero-video-bg" src="video入场视频.mp4" autoplay muted loop playsinline></video>
            <div class="hero-content">
                <div class="avatar-wrapper">
                    <img src="photo头像.jpg" alt="蒋汶伶头像" class="avatar" loading="lazy" onerror="this.style.background='#2d2b55'">
                </div>
                <img src="photo名字.png" alt="蒋汶伶艺术字" class="name-art">
                <p class="subtitle">@小蒋的大学不设限 · 信息管理与信息系统</p>
                <p class="eng-tag">"Designing futures with AI & creativity"</p>
                <div class="skill-badges" id="heroBadges"></div>
                <div class="email-display" id="emailDisplay">📧 jiangwenling8606@126.com</div>
                <div style="margin-top:0.8rem;">
                    <button class="icon-btn" id="copyEmail" style="width:auto;border-radius:30px;padding:0 1.2rem;background:rgba(255,255,255,0.2);color:white;font-weight:500;">复制邮箱</button>
                </div>
            </div>
        </section>

        <!-- 教育背景 -->
        <section id="education" class="education-hero">
            <h2 style="font-weight:700; letter-spacing:-0.3px;">🎓 教育背景 <small style="font-weight:400; font-size:0.8rem; color:var(--neutral-600); margin-left:0.3rem;">Education</small></h2>
            <div class="card" id="educationCard"></div>
        </section>

        <!-- 亮点成果区 -->
        <section id="highlights">
            <h2 style="margin:1.5rem 0 0.8rem; font-weight:700;">✨ 亮点成果 <small style="font-weight:400; font-size:0.8rem; color:var(--neutral-600);">Highlights</small></h2>
            <div class="highlights-grid" id="highlightsContainer"></div>
        </section>

        <!-- 经历 Tabs -->
        <section id="experience">
            <h2 style="font-weight:700;">💼 经历 <small style="font-weight:400; font-size:0.8rem; color:var(--neutral-600);">Experience</small></h2>
            <div class="tabs" id="expTabs" role="tablist"></div>
            <div id="expContent"></div>
        </section>

        <!-- 项目 Tabs -->
        <section id="projects">
            <h2 style="font-weight:700;">📁 项目经历 <small style="font-weight:400; font-size:0.8rem; color:var(--neutral-600);">Projects</small></h2>
            <div class="tabs" id="projTabs" role="tablist"></div>
            <div id="projContent"></div>
        </section>

        <!-- 技能矩阵 -->
        <section id="skills">
            <h2 style="font-weight:700;">⚡ 专业技能 <small style="font-weight:400; font-size:0.8rem; color:var(--neutral-600);">Skills</small></h2>
            <div id="skillsContainer"></div>
        </section>

        <!-- 获奖与证书 -->
        <section id="certs">
            <h2 style="font-weight:700;">🏆 获奖与证书 <small style="font-weight:400; font-size:0.8rem; color:var(--neutral-600);">Awards</small></h2>
            <div class="cert-scroll-wrapper">
                <div class="cert-scroll-hint">
                    <span>向左滑动查看更多</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </div>
                <div class="cert-grid" id="certsGrid"></div>
            </div>
        </section>

        <footer style="text-align:center; margin-top:2.5rem; color:var(--neutral-600); font-size:0.8rem; opacity:0.85;">
            © 2026 蒋汶伶 · 更新于2026.05 · <span style="font-style:italic;">Starlight Edition</span>
        </footer>
    </div>

    <!-- 音频元素 -->
    <audio id="bgAudio" preload="none" src="audio稻香.mp3"></audio>
    <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

    <!-- 图片灯箱 -->
    <div id="lightbox" style="display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;flex-direction:column;">
        <button class="lightbox-arrow left" id="lightboxPrev" style="display:none;">‹</button>
        <img id="lightboxImg" style="max-width:90%;max-height:80%;border-radius:1rem; box-shadow:0 0 30px rgba(0,0,0,0.5);">
        <button class="lightbox-arrow right" id="lightboxNext" style="display:none;">›</button>
        <span style="color:white; margin-top:1rem; font-size:0.85rem;" id="lightboxCounter"></span>
        <button style="position:absolute;top:20px;right:25px;background:none;border:none;color:white;font-size:2rem;cursor:pointer;opacity:0.8;" onclick="document.getElementById('lightbox').style.display='none'">✕</button>
    </div>

    <script>
        (function() {
            // 生成星星到夜晚背景
            const nightBg = document.getElementById('nightBg');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.8;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = (Math.random() * 4 + 3) + 's';
                nightBg.appendChild(star);
            }

            // 深浅模式切换
            const html = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('theme');
            function applyTheme(isDark) {
                if (isDark) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                applyTheme(true);
            } else {
                applyTheme(false);
            }
            themeToggle.addEventListener('click', () => {
                const willBeDark = !html.classList.contains('dark');
                applyTheme(willBeDark);
                localStorage.setItem('theme', willBeDark ? 'dark' : 'light');
            });

            // 简历数据
            const resume = {
                education: {
                    school: '哈尔滨工业大学（威海）',
                    major: '信息管理与信息系统',
                    degree: '本科',
                    period: '2024.09 - 2028.06（预计）',
                    courses: '数据结构、数据库系统、管理统计学、运筹学、统计学等',
                    gpa: 'GPA：【待补】/4.0'
                },
                skills: [
                    { name: 'AI工具与数据分析', level: 92, desc: 'ChatGPT、小浣熊、Trae、Deepseek、Coze、Gemini、SPSS、提示词工程' },
                    { name: '新媒体与内容运营', level: 88, desc: '小红书/抖音/视频号算法、选题策划、AI脚本、剪辑复盘' },
                    { name: '社群与渠道运营', level: 85, desc: '校园社群0-1搭建、KOC推广、活动策划与转化' },
                    { name: '工具与认证', level: 82, desc: 'WPS、Canva、剪映、数智化管理师、英语六级' }
                ],
                highlights: [
                    { number: '10万+', title: '总播放量', back: '自媒体矩阵累计播放突破10万，带动账号涨粉100+' },
                    { number: '90+', title: '支教报名', back: '裂变海报+校园KOC，报名人数增长50%' },
                    { number: '20+', title: '核心社员', back: '美团AIGC学习社首期成员，活跃度70%' },
                    { number: '500+', title: '推文阅读', back: '班级公众号单篇最高阅读量，凝聚班级文化' }
                ],
                experiences: [{
                    tab: '工作/实习',
                    items: [
                        { role: '会长', org: '美团AIGC学习社', period: '2026.04 - 至今', details: ['从0到1创建校级AI社团，首期成员20+人。','搭建AI知识库，收录100+条精品内容。','带领小组获年级第2名（40+队伍）。','开发3款小游戏，沉淀AI产品SOP。'] },
                        { role: '宣传部负责人', org: '家乡大学生联合会', period: '2025.03 - 至今', details: ['统筹10+场宣传，推文打开率28%。','支教招募90+人，增长50%。','管理7人团队，产出30+件物料。'] },
                        { role: '办公/摄影部部员', org: '校新媒体中心', period: '2024.10 - 至今', details: ['参与6场200+人活动，满意度4.8。','独立制作9个部门排班表零差错。','设计招新方案，面试100+人。'] },
                        { role: '创始人', org: '校园家教群与知识库', period: '2025.09 - 至今', details: ['搭建付费社群，月盈利500+，复购率20%。','发布资料包15个，好评率98%。','承接保研推广，转化率高于均值2倍。'] },
                        { role: '宣传组负责人', org: '中学生领导力展会公益宣传', period: '2025.07', details: ['500人展会，带领20人团队。','审核物料40+件。','志愿者留存率95%。'] }
                    ]
                }],
                projects: [
                    { tab: '自媒体矩阵', items: [{ name: '自媒体账号矩阵运营', role: '独立运营者', period: '2026.03 - 至今', cover: 'photo作品集封面.png', details: ['聚焦校园AI赛道，总播放10万+。','单条视频500+赞，5万播放。','AI内容SOP，效率提升50%。'] }] },
                    { tab: '班级品牌', items: [{ name: '班级公众号与品牌建设', role: '副班长（宣传）', period: '2024.09 - 至今', details: ['从0搭建公众号，原创推文3篇。','组织7场线下活动，到场率90%。','获校级优秀社会实践提名奖。'] }] }
                ],
                certificates: [
                    { name: '数智化管理师（初级）', img: '' },
                    { name: '人工智能训练师', img: 'photo人工智能训练师（初级）.jpg' },
                    { name: 'AI+数据分析能力认证', img: 'photoAI+数据分析能力认证.png' },
                    { name: '优秀志愿者称号', img: 'photo优秀志愿者.jpg', img2: 'photo优秀志愿者2.jpg' },
                    { name: '大学英语六级', img: '' },
                    { name: '沙盘大赛省级一等奖', img: 'photo沙盘校一.jpg', img2: 'photo数智化企业经营沙盘大赛2.jpg' },
                    { name: '校级优秀社会实践', img: 'photo寒假社会实践十佳.jpg' },
                    { name: '市场调研大赛校二等奖', img: '' },
                    { name: '十佳团队提名', img: 'photo寒假社会实践十佳.jpg' },
                    { name: '优秀团员', img: 'photo优秀团员.jpg' },
                    { name: '优秀阅读推广人', img: 'photo复兴文库优秀阅读推广人.jpg' },
                    { name: '军训优秀学员', img: 'photo军训优秀学员.jpg' }
                ]
            };

            // 渲染英雄区技能徽章
            document.getElementById('heroBadges').innerHTML = ['AI工具', '新媒体', '社群运营', '数据分析'].map(s => `<span class="badge">${s}</span>`).join('');
            document.getElementById('copyEmail').onclick = () => navigator.clipboard.writeText('jiangwenling8606@126.com').then(() => alert('邮箱已复制！'));

            // 教育背景
            const e = resume.education;
            document.getElementById('educationCard').innerHTML = `<strong style="font-size:1.1rem;">${e.school}</strong> · ${e.major} · ${e.degree}<br><small>${e.period}</small><br>主修：${e.courses}<br>${e.gpa}`;

            // 亮点翻转卡片
            const hc = document.getElementById('highlightsContainer');
            resume.highlights.forEach(h => {
                const card = document.createElement('div'); card.className = 'flip-card';
                card.innerHTML = `<div class="flip-inner"><div class="flip-front"><span class="highlight-number" data-target="${parseInt(h.number)}">0</span><div style="font-weight:700;">${h.title}</div><small>点击翻转</small></div><div class="flip-back"><p>${h.back}</p><small>点击返回</small></div></div>`;
                card.onclick = () => card.classList.toggle('flipped');
                hc.appendChild(card);
            });
            setTimeout(() => {
                document.querySelectorAll('.highlight-number').forEach(el => {
                    const t = parseInt(el.dataset.target) || 0;
                    let c = 0;
                    const i = t / 30;
                    const timer = setInterval(() => {
                        c += i;
                        if (c >= t) { el.textContent = t + (t>100?'+':''); clearInterval(timer); }
                        else el.textContent = Math.floor(c) + (t>100?'+':'');
                    }, 40);
                });
            }, 400);

            // 音频控制
            const audio = document.getElementById('bgAudio');
            const abtn = document.getElementById('audioToggle');
            abtn.onclick = () => {
                if (audio.paused) { audio.play(); abtn.innerHTML = '🔊 <span class="audio-tooltip">暂停音乐</span>'; }
                else { audio.pause(); abtn.innerHTML = '🔇 <span class="audio-tooltip">打开背景音乐</span>'; }
            };

            // 经历渲染（时间单独一行）
            const expTabs = document.getElementById('expTabs');
            const expContent = document.getElementById('expContent');
            function renderExp(items) {
                return items.map(item => `
                    <div class="exp-flip" onclick="this.classList.toggle('flipped')">
                        <div class="exp-flip-inner">
                            <div class="exp-front">
                                <div><strong>${item.role} · ${item.org}</strong></div>
                                <div class="period">${item.period}</div>
                                <p class="summary">${item.details[0]}</p>
                                <span class="turn-hint">点击翻转查看详情 →</span>
                            </div>
                            <div class="exp-back">
                                <ul style="padding-left:1.2rem;text-align:left;">${item.details.map(d=>`<li style="margin-bottom:0.4rem;">${d}</li>`).join('')}</ul>
                                <small style="color:var(--primary); margin-top:0.5rem;">点击返回</small>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            resume.experiences.forEach((exp,i) => {
                const btn = document.createElement('button'); btn.className='tab-btn'+(i===0?' active':''); btn.textContent=exp.tab;
                btn.onclick = () => { expTabs.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); expContent.innerHTML = renderExp(exp.items); };
                expTabs.appendChild(btn);
            });
            if(resume.experiences.length) expContent.innerHTML = renderExp(resume.experiences[0].items);

            // 项目渲染（时间单独一行）
            const projTabs = document.getElementById('projTabs');
            const projContent = document.getElementById('projContent');
            function renderProj(items) {
                return items.map(item => `
                    <div class="exp-flip" onclick="this.classList.toggle('flipped')">
                        <div class="exp-flip-inner">
                            <div class="exp-front">
                                ${item.cover ? `<img src="${item.cover}" style="width:100%;height:100px;object-fit:cover;border-radius:0.5rem;margin-bottom:0.5rem;" loading="lazy" onerror="this.style.display='none'">` : ''}
                                <div><strong>${item.name}</strong></div>
                                <div class="period">${item.role} · ${item.period}</div>
                                <p class="summary">${item.details[0]}</p>
                                <span class="turn-hint">点击翻转查看详情 →</span>
                            </div>
                            <div class="exp-back">
                                <ul style="padding-left:1.2rem;text-align:left;">${item.details.map(d=>`<li>${d}</li>`).join('')}</ul>
                                <small style="color:var(--primary); margin-top:0.5rem;">点击返回</small>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            resume.projects.forEach((proj,i) => {
                const btn = document.createElement('button'); btn.className='tab-btn'+(i===0?' active':''); btn.textContent=proj.tab;
                btn.onclick = () => { projTabs.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); projContent.innerHTML = renderProj(proj.items); };
                projTabs.appendChild(btn);
            });
            if(resume.projects.length) projContent.innerHTML = renderProj(resume.projects[0].items);

            // 技能渲染
            const skillsC = document.getElementById('skillsContainer');
            resume.skills.forEach(s => {
                const div = document.createElement('div'); div.className='card';
                div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;"><strong style="font-size:1rem;">${s.name}</strong><span style="font-weight:700;color:var(--primary);">${s.level}%</span></div><div style="background:var(--neutral-200);height:8px;border-radius:10px;margin-top:0.5rem;"><div style="width:${s.level}%;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:10px;box-shadow:0 0 6px rgba(167,139,250,0.4);"></div></div><small style="color:var(--neutral-600);display:block;margin-top:0.4rem;">${s.desc}</small>`;
                skillsC.appendChild(div);
            });

            // 证书与灯箱
            const certsGrid = document.getElementById('certsGrid');
            let lbImages = [], lbIdx = 0;
            function openLightbox(imgs) { lbImages = imgs; lbIdx = 0; showLb(); document.getElementById('lightbox').style.display='flex'; updateArrows(); }
            function showLb() { document.getElementById('lightboxImg').src = lbImages[lbIdx]; document.getElementById('lightboxCounter').textContent = `${lbIdx+1}/${lbImages.length}`; }
            function updateArrows() { document.getElementById('lightboxPrev').style.display = lbImages.length>1?'block':'none'; document.getElementById('lightboxNext').style.display = lbImages.length>1?'block':'none'; }
            document.getElementById('lightboxPrev').onclick = (e) => { e.stopPropagation(); if(lbIdx>0) lbIdx--; showLb(); };
            document.getElementById('lightboxNext').onclick = (e) => { e.stopPropagation(); if(lbIdx<lbImages.length-1) lbIdx++; showLb(); };
            document.getElementById('lightbox').addEventListener('click', function(e) { if(e.target === this) this.style.display = 'none'; });

            resume.certificates.forEach(c => {
                const div = document.createElement('div'); div.className='cert-item';
                div.innerHTML = `${c.img?`<img src="${c.img}" alt="${c.name}" loading="lazy" onerror="this.style.display='none'">`:'<div style="height:75px;background:rgba(255,255,255,0.1);border-radius:0.5rem;display:flex;align-items:center;justify-content:center;font-size:2rem;">🏅</div>'}<span>${c.name}</span>`;
                div.onclick = () => {
                    const imgs = []; if(c.img) imgs.push(c.img); if(c.img2) imgs.push(c.img2);
                    if(imgs.length) openLightbox(imgs);
                };
                certsGrid.appendChild(div);
            });

            document.querySelector('.avatar').onclick = function() { openLightbox([this.src]); };
            document.getElementById('backToTop').onclick = () => window.scrollTo({top:0,behavior:'smooth'});
            document.getElementById('printBtn').onclick = () => window.print();
        })();
    </script>
</body>
</html>
